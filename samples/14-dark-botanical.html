<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>M4·L3 Carbon cycle and climate change · SOS110</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}



:root{--stage-bg:#000;--slide-bg:#0f0f0f;--fg:#e8e4df;--mute:#9a9590;--warm:#d4a574;--pink:#e8b4b8;--gold:#c9b896}
.slide{font-family:'IBM Plex Sans',sans-serif;font-weight:300;color:var(--fg);text-align:center}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0;transition:opacity 2s}
.slide.visible .orb{opacity:.55}
.v{position:absolute;top:0;width:1px;height:0;background:linear-gradient(transparent,var(--gold),transparent);transition:height 1.6s ease .3s}
.slide.visible .v{height:1080px}
.k{position:absolute;left:0;right:0;top:220px;font:400 22px 'IBM Plex Sans';letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
h1{position:absolute;left:260px;right:260px;top:290px;font:400 136px/1.04 'Cormorant'}
h1 em{font-style:italic;color:var(--pink)}
.terms{position:absolute;left:0;right:0;top:640px;font:300 26px 'IBM Plex Sans';letter-spacing:.08em;color:var(--fg)}
.terms .t+.t::before{content:'   ·   ';color:var(--gold)}
.who{position:absolute;left:0;right:0;top:790px;font:italic 400 44px 'Cormorant';color:var(--warm)}
.org{position:absolute;left:0;right:0;top:855px;font:300 24px 'IBM Plex Sans';color:var(--mute);letter-spacing:.04em}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}.slide.visible .reveal{opacity:1;transform:none}.slide.visible .d2{transition-delay:.15s}.slide.visible .d3{transition-delay:.3s}.slide.visible .d4{transition-delay:.5s}
</style></head><body><div class="deck-viewport"><main class="deck-stage" id="deckStage"><section class="slide active">

<div class="orb" style="width:620px;height:620px;right:-160px;bottom:-200px;background:var(--pink)"></div>
<div class="orb" style="width:380px;height:380px;right:320px;top:-120px;background:var(--gold)"></div>
<div class="v" style="left:180px"></div><div class="v" style="right:180px"></div>
<div class="k reveal">Module 4 · Lecture 3 · S&amp;M Ch. 11</div>

<div class="terms reveal d3"><span class="t">Mitigation</span> <span class="t">Adaptation</span> <span class="t">Adaptive Capacity</span> <span class="t">Precautionary Principle</span></div>
<div class="who reveal d3">SOS110</div><div class="org reveal d4">Arizona State University</div>
</section></main></div><script>
const st=document.getElementById('deckStage');
function sc(){const f=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
sc();addEventListener('resize',sc);
requestAnimationFrame(()=>document.querySelector('.slide').classList.add('visible'));
</script></body></html>
