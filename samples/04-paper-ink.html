<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>M7·L1 Indigenous sustainability · SOS110</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}



:root{--stage-bg:#e8e4dc;--slide-bg:#faf9f7;--ink:#1a1a1a;--red:#c41e3a;--mute:#6b6560}
.slide{color:var(--ink);font-family:'Source Serif 4',serif}
.frame{position:absolute;inset:60px;border:1px solid rgba(26,26,26,.25)}

.orn{position:absolute;left:50%;top:200px;transform:translateX(-50%);width:420px;height:20px}
h1{position:absolute;left:260px;right:260px;top:280px;text-align:center;font:500 150px/1 'Cormorant Garamond';letter-spacing:-.01em}
h1 .cap{color:var(--red);font-weight:600}h1 em{font-style:italic;color:var(--red)}
.terms{position:absolute;left:0;right:0;top:620px;text-align:center;font:italic 400 34px 'Cormorant Garamond';color:var(--mute)}
.terms .t+.t::before{content:' · ';color:var(--red)}
.hr{position:absolute;left:50%;top:710px;width:0;height:1px;background:var(--ink);transform:translateX(-50%);transition:width 1.2s cubic-bezier(.16,1,.3,1) .4s}
.slide.visible .hr{width:560px}
.lec{position:absolute;left:0;right:0;top:750px;text-align:center;font:600 22px 'Source Serif 4';letter-spacing:.3em;text-transform:uppercase}
.who{position:absolute;left:0;right:0;top:830px;text-align:center;font:italic 500 44px 'Cormorant Garamond'}
.org{position:absolute;left:0;right:0;top:895px;text-align:center;font:400 24px 'Source Serif 4';color:var(--mute)}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}.slide.visible .reveal{opacity:1;transform:none}.slide.visible .d2{transition-delay:.15s}.slide.visible .d3{transition-delay:.3s}.slide.visible .d4{transition-delay:.5s}
</style></head><body><div class="deck-viewport"><main class="deck-stage" id="deckStage"><section class="slide active">
<div class="frame"></div>
<div class="top reveal">Module 7 — Institutional Change for Sustainability</div>
<svg class="orn reveal" viewBox="0 0 420 20"><line x1="0" y1="10" x2="180" y2="10" stroke="#1a1a1a" stroke-width="1"/><circle cx="210" cy="10" r="6" fill="#c41e3a"/><line x1="240" y1="10" x2="420" y2="10" stroke="#1a1a1a" stroke-width="1"/></svg>

<div class="hr"></div>
<div class="lec reveal d3">Lecture 1 · Nelson (2017)</div>
<div class="who reveal d4">SOS110</div><div class="org reveal d4">Arizona State University</div>
</section></main></div><script>
const st=document.getElementById('deckStage');
function sc(){const f=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
sc();addEventListener('resize',sc);
requestAnimationFrame(()=>document.querySelector('.slide').classList.add('visible'));
</script></body></html>
