<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS110 Building a Sustainable World</title>
<meta name="robots" content="noindex">
<meta name="description" content="Lecture pages for SOS110, Building a Sustainable World.">

<!-- === FONTS === webapp design: DM Serif Display headings, Archivo Narrow body -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Archivo+Narrow:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===========================================
   COURSE HOME (webapp design, same look as the lecture decks)
   Beige page, white cards, DM Serif Display headings, Archivo Narrow body,
   gold #C4851C accent, red #e53b3b for everything you tap, calm ease-out motion.
   A plain list of the lectures posted so far, grouped by module.
   Add a card in the <template> below when a new lecture folder is published.
   =========================================== */
:root {
  --page:#eeeae0; --card:#fff; --soft:#f7f5ef; --line:#d9d4c7;
  --ink:#222; --head:#2b2b2b; --mute:#555;
  --accent:#C4851C; --red:#e53b3b; --red-d:#c42f2f; --green:#2e7d5b;
  --display:'DM Serif Display', Georgia, serif;
  --body:'Archivo Narrow','Helvetica Neue','Arial Narrow',Arial,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--page); color:var(--ink); font:400 20px/1.4 var(--body); }
a { color:var(--red); }
.wrap { max-width:1120px; margin:0 auto; }

/* === HEADER === quiet kicker line, big serif title, gold rule */
header { padding:44px 16px 8px; }
header .k { font:600 15px var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
header h1 { font:400 clamp(44px, 7.5vw, 84px)/1 var(--display); color:var(--head); margin:14px 0 18px; }
header h1 em { color:var(--accent); font-style:normal; }
.rule { width:120px; height:5px; background:var(--accent); }

main { padding:32px 16px 72px; }
h2 { font:400 clamp(28px, 4vw, 40px)/1.1 var(--display); color:var(--head); margin:8px 0 18px; }

[hidden] { display:none !important; }
.module { margin-top:28px; background:var(--card); padding:28px 30px 30px; }
.module:first-child { margin-top:8px; }
.module h2 { padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:20px; }
.module h2 span { display:block; font:600 15px var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; }
.card { display:block; text-decoration:none; color:inherit; background:var(--soft);
  border-top:5px solid var(--accent); padding:18px 22px 20px; transition:transform .25s var(--ease), box-shadow .25s var(--ease); }
.card:hover, .card:focus-visible { transform:translateY(-3px); box-shadow:0 10px 26px rgba(0,0,0,.12); outline:none; }
.card:focus-visible { outline:3px solid var(--red); outline-offset:2px; }
.card:active { transform:scale(.97); }
.card.review { border-top-color:var(--head); }
.card .meta { font:600 14px var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.card h3 { font:400 26px/1.15 var(--display); color:var(--head); margin:8px 0 10px; }
.card .go { display:inline-flex; align-items:center; gap:8px; font:700 17px var(--body); color:var(--red); }

/* === ACCESS GATE === the lecture list shows after the access code or instructor sign-in */
.gate { max-width:600px; margin:24px auto 0; text-align:center; background:var(--card); border-top:6px solid var(--accent); padding:34px 26px; }
.gate h2 { margin-top:0; }
.gate p { color:var(--mute); }
.btn { font:700 19px var(--body); letter-spacing:.02em; background:var(--red); color:#fff; border:0; border-radius:999px; padding:12px 28px; cursor:pointer; margin-top:16px; transition:transform .16s var(--ease), background .2s; }
.btn:hover, .btn:focus-visible { background:var(--red-d); }
.btn:active { transform:scale(.97); }
.btn[disabled] { opacity:.6; cursor:wait; }
.btn.quiet { background:#fff; color:var(--red); border:2px solid var(--red); padding:7px 18px; font-size:16px; margin:0; }
.btn.quiet:hover, .btn.quiet:focus-visible { background:var(--red); color:#fff; }
.msg { min-height:1.5em; margin-top:14px; font-size:17px; }
.msg.err { color:#b3452c; }
.gate hr { border:0; border-top:1px solid var(--line); margin:28px 0 20px; }
.code-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
.code-row input { font:700 20px var(--body); letter-spacing:.12em; text-transform:uppercase; padding:10px 18px; border:2px solid var(--line); border-radius:0; background:#fff; color:var(--ink); width:230px; }
.code-row input:focus { outline:3px solid var(--red); outline-offset:2px; border-color:var(--red); }
.code-row .btn { margin-top:0; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.who { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font-size:17px; color:var(--mute); margin-bottom:8px; }

footer { border-top:1px solid var(--line); padding:28px 16px 40px; font-size:17px; color:var(--mute); }

/* entrance: rise and fade, transform and opacity only */
.module, .gate { animation:rise .5s var(--ease) both; }
@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) {
  .module, .gate { animation:none; }
  .card, .btn { transition:none; }
}
@media (max-width:600px) { .module { padding:22px 18px 24px; } }

</style>
</head>
<body>

  <div class="wrap">
    <div class="k">Lectures and class exercises</div>

    <div class="rule" aria-hidden="true"></div>

  <!-- === LECTURE LIST === add a card here when a new lecture folder is published.

    <div class="grid">
      <a class="card" href="lectures/m1-l1-triple-bottom-line/"><div class="meta">Lecture 2 · M1 L1</div><h3>The Triple Bottom Line of Sustainability</h3><span class="go">Open lecture →</span></a>
      <a class="card" href="lectures/m1-l2-environmental-science/"><div class="meta">Lecture 3 · M1 L2</div><h3>Environmental science in sustainability</h3><span class="go">Open lecture →</span></a>
      <a class="card" href="lectures/m1-l3-social-sustainability/"><div class="meta">Lecture 4 · M1 L3</div><h3>Social sustainability</h3><span class="go">Open lecture →</span></a>
      <a class="card review" href="lectures/m1-review-sets/"><div class="meta">M1 · TA-led review</div><h3>Drawing SETs diagrams</h3><span class="go">Open lecture →</span></a>
    </div>
  </section>
  <section class="module">
    <h2><span>Module 2</span>Why Do We Need Healthy Ecosystems?</h2>
    <div class="grid">
      <a class="card review" href="lectures/m2-review-grand-canyon/"><div class="meta">M2 · TA-led review</div><h3>Ecosystem Services of the Grand Canyon</h3><span class="go">Open lecture →</span></a>
    </div>
  </section>
  <section class="module">
    <h2><span>Module 3</span>Societal Role in Maintaining Healthy Life-Supporting Systems</h2>
    <div class="grid">
      <a class="card" href="lectures/m3-l1-demographic-transition/"><div class="meta">Lecture 8 · M3 L1</div><h3>Population and consumption</h3><span class="go">Open lecture →</span></a>
      <a class="card" href="lectures/m3-l3-atmosphere/"><div class="meta">Lecture 10 · M3 L3</div><h3>Atmosphere, weather, and pollution</h3><span class="go">Open lecture →</span></a>

    <div class="grid">

      <a class="card" href="lectures/m4-l1-exercises/"><div class="meta">Lecture 11 · M4 L1</div><h3>Geosphere, soil, and land use: in-class exercises</h3><span class="go">Open exercises →</span></a>

      <a class="card" href="lectures/m5-l3-exercises/"><div class="meta">Lecture 16 · M5 L3</div><h3>Class Exercise 16: solar at home and energy justice</h3><span class="go">Open exercises →</span></a>

</main>

<footer>
  <div class="wrap">Use arrow keys, space or swipe to move through a lecture. On the attendance slide, enter your name, email and the code shown in class.</div>

<script type="module">
/* === INSTRUCTOR GATE === Google sign-in with the admin account from shared/firebase-config.js */
import { firebaseConfig, adminEmails } from './shared/firebase-config.js';
import { accessCodeHash } from './shared/access.js';
const $ = s => document.querySelector(s);
const btn = $('#signin'), msg = $('#msg');
const say = (t, err) => { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); };

function showList(who) {
  const list = $('#list');
  if (!list.dataset.filled) { list.append($('#lectures').content.cloneNode(true)); list.dataset.filled = '1'; }
  $('#who').textContent = who;
  $('#gate').hidden = true; list.hidden = false;
}

/* === STUDENT ACCESS CODE === checked against the hash in shared/access.js, remembered in this browser */
const UNLOCK = 'sos110-home-access';
const hash = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, '0')).join('');
const unlocked = () => { try { return localStorage.getItem(UNLOCK) === accessCodeHash; } catch { return false; } };
let signOut = null;
const showStudent = () => { showList('Student access'); $('#signout').textContent = 'Lock'; };
$('#code-form').onsubmit = async e => {
  e.preventDefault();
  const m = $('#code-msg');
  const h = await hash('sos110:' + $('#access').value.trim().toUpperCase());
  if (h !== accessCodeHash) { m.textContent = 'That code is not right. Check with your instructor.'; m.className = 'msg err'; return; }
  try { localStorage.setItem(UNLOCK, h); } catch { /* storage blocked: unlocked for this visit */ }
  m.textContent = ''; showStudent();
};
$('#signout').onclick = () => {
  try { localStorage.removeItem(UNLOCK); } catch { /* ignore */ }
  if (signOut && $('#signout').textContent === 'Sign out') return signOut();
  $('#list').hidden = true; $('#gate').hidden = false;
};
function showGate(text, err) { $('#list').hidden = true; $('#gate').hidden = false; btn.disabled = false; say(text || '', err); }

const tips = {
  'auth/unauthorized-domain': `${location.hostname} is not an authorized domain. Add it in Firebase console > Authentication > Settings > Authorized domains.`,
  'auth/operation-not-allowed': 'Google sign-in is turned off. Enable it in Firebase console > Authentication > Sign-in method.',
  'auth/popup-closed-by-user': 'The sign-in window was closed before finishing. Try again.',
  'auth/cancelled-popup-request': 'Another sign-in window was already open. Try again.',
  'auth/network-request-failed': 'Could not reach Google. Check the connection and try again.',
};
const explain = e => `${tips[e?.code] || e?.message || 'Sign-in failed.'}${e?.code ? ` (${e.code})` : ''}`;

if (firebaseConfig && unlocked()) showStudent(); // no need to wait for Firebase
if (!firebaseConfig) showList('Demo mode: no Firebase config, so the list is open.');
else {
  try {
    const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [{ initializeApp }, auth] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js')]);
    const a = auth.getAuth(initializeApp(firebaseConfig));
    const isAdmin = u => !!u && !u.isAnonymous && adminEmails.includes(u.email);
    const check = u => {
      if (isAdmin(u)) { showList(`Signed in as ${u.email}`); $('#signout').textContent = 'Sign out'; }
      else if (unlocked()) { showStudent(); btn.disabled = false; say(''); }
      else if (u && !u.isAnonymous) showGate(`${u.email} is not the instructor account. Sign in with ${adminEmails[0]}.`, true);
      else showGate('');
    };
    let redirectError = null;
    try { await auth.getRedirectResult(a); } catch (e) { redirectError = e; }
    auth.onAuthStateChanged(a, u => { check(u); if (redirectError) { say(explain(redirectError), true); redirectError = null; } });
    btn.onclick = async () => {
      const p = new auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      btn.disabled = true; say('Opening Google sign-in…');
      try { await auth.signInWithPopup(a, p); }
      catch (e) {
        // Pop-up blocked: fall back to a full-page redirect.
        if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) return auth.signInWithRedirect(a, p);
        showGate(explain(e), true);
      }
    };
    signOut = () => auth.signOut(a);
  } catch (e) { if (!unlocked()) showGate(`Sign-in could not load: ${e.message}`, true); btn.disabled = true; }
}
</script>
