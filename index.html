<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS110 Building a Sustainable World</title>
<meta name="description" content="Lecture pages for SOS110, Building a Sustainable World.">

<!-- === FONTS === Course Brand (sample 16): DM Serif Display headings, PT Serif body -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* ===========================================
   COURSE HOME
   A plain landing page in the Course Brand palette. It deliberately lists
   no lectures: students get each lecture link in class, and the full list
   lives on the private admin site.
   =========================================== */
:root {
  --Green:#75a29f; --golden:#eccf72; --Sky:#42a8bf; --Blue:#0d7397; --deep:#0a4f68;
  --ink:#10313d; --mute:#4c6670; --paper:#f6f2e9; --paper-2:#ece5d6; --card:#fffdf8;
  --display:'DM Serif Display', Georgia, serif;
  --body:'PT Serif', Georgia, serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--paper); color:var(--ink); font:400 18px/1.55 var(--body); }
a { color:var(--Blue); }

/* === HEADER === blue band, like the title slides */
header { background:var(--Blue); color:var(--paper); padding:56px 16px 48px; }
.wrap { max-width:1040px; margin:0 auto; }
header .k { color:var(--golden); }
header h1 { font:400 clamp(40px, 7vw, 76px)/1.05 var(--display); margin:14px 0 18px; }
header h1 em { color:var(--golden); }
header p { max-width:640px; color:rgba(246,242,233,.9); }
.swatches { display:flex; gap:10px; margin-top:26px; }
.swatches i { width:22px; height:22px; border-radius:50%; border:2px solid var(--paper); }

.k { font:700 14px var(--body); letter-spacing:.18em; text-transform:uppercase; color:var(--Blue); }
main { padding:48px 16px 72px; }
h2 { font:400 clamp(28px, 4vw, 40px)/1.15 var(--display); margin:8px 0 20px; }

.note { max-width:620px; margin:8px 0; }
.note p { color:var(--mute); }

footer { border-top:1px solid var(--paper-2); padding:28px 16px 40px; font-size:15px; color:var(--mute); }

</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="k" id="term">School of Sustainability</div>
    <h1>SOS110 Building a <em>Sustainable</em> World</h1>
    <div class="swatches" aria-hidden="true">
      <i style="background:var(--Green)"></i><i style="background:var(--golden)"></i><i style="background:var(--Sky)"></i><i style="background:var(--deep)"></i>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="note">
    <h2>Welcome</h2>
    <p>Open each lecture from the link shared in class.</p>
  </section>
</main>

<footer>
  <div class="wrap">Use arrow keys, space or swipe to move through a lecture. Sign in with your ASU Google account when a slide asks you to check in or vote.</div>
</footer>

</body>
</html>
