<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SETs in Sustainability</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Jost:wght@300;400&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}


:root{--stage-bg:#101c11;--slide-bg:#192b1b;--fg:#d4cfbf;--accent:#c8524a;--line:rgba(212,207,191,.18)}
.slide{color:var(--fg);font-family:'Jost',sans-serif;font-weight:300}
.bar{position:absolute;left:96px;right:96px;height:64px;display:flex;align-items:center;justify-content:space-between;font:300 18px 'JetBrains Mono';letter-spacing:.16em;text-transform:uppercase;color:rgba(212,207,191,.6)}
.bar.top{top:40px;border-bottom:1px solid var(--line)}.bar.bot{bottom:40px;border-top:1px solid var(--line)}
.water{position:absolute;right:40px;top:40px;font:400 900px/1 'Playfair Display';color:rgba(212,207,191,.035);letter-spacing:-.05em}
.kicker{position:absolute;left:200px;top:300px;font:300 22px 'JetBrains Mono';letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.krule{position:absolute;left:200px;top:348px;width:0;height:1px;background:var(--accent);transition:width .9s .3s}
.slide.visible .krule{width:36px}
h1{position:absolute;left:200px;top:390px;width:1300px;font:400 104px/1.08 'Playfair Display';letter-spacing:-.01em}
h1 em{color:var(--accent);font-style:italic}
.sub{position:absolute;left:200px;top:800px;font:300 30px/1.5 'Jost';color:rgba(212,207,191,.8)}
.leaf{position:absolute;right:220px;top:330px;width:340px;height:420px;opacity:.55}
.leaf path{fill:none;stroke:var(--fg);stroke-width:1.2;stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 2.2s ease .4s}
.slide.visible .leaf path{stroke-dashoffset:0}
.reveal{opacity:0;transform:translateY(24px);transition:all 1.1s cubic-bezier(.16,1,.3,1)}
.slide.visible .reveal{opacity:1;transform:none}.slide.visible .d2{transition-delay:.2s}.slide.visible .d3{transition-delay:.45s}
</style></head><body><div class="deck-viewport"><main class="deck-stage" id="deckStage"><section class="slide active">
<div class="water">02</div>
<div class="bar top reveal"><span>Module 1 — Sustainability for Our Planet</span><span>Lecture 02</span></div>
<div class="kicker reveal">Environmental Sustainability</div><div class="krule"></div>
<h1 class="reveal d2">Socio-ecological-technological Systems in <em>Sustainability</em></h1>
<div class="sub reveal d3">Dr. Milan Shrestha — School of Sustainability, Arizona State University</div>
<svg class="leaf" viewBox="0 0 340 420"><path d="M170 410 C170 300 170 150 170 10"/><path d="M170 10 C300 80 330 250 170 410 C10 250 40 80 170 10Z"/>
<path d="M170 120 C210 100 240 95 265 100"/><path d="M170 120 C130 100 100 95 75 100"/><path d="M170 200 C220 175 260 170 295 180"/><path d="M170 200 C120 175 80 170 45 180"/><path d="M170 280 C210 262 245 258 275 265"/><path d="M170 280 C130 262 95 258 65 265"/></svg>
<div class="bar bot reveal d3"><span>SETs · Systems Thinking</span><span>01 / 24</span></div>
</section></main></div><script>
const st=document.getElementById('deckStage');
function sc(){const f=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
sc();addEventListener('resize',sc);
requestAnimationFrame(()=>document.querySelector('.slide').classList.add('visible'));
</script></body></html>
