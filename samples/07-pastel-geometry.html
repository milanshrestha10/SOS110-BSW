<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>M2·L3 Biomimicry and nature-inspired designs · SOS110</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}



:root{--stage-bg:#c8d9e6;--slide-bg:#c8d9e6;--card:#faf9f7;--ink:#1f2a33}
.slide{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink)}
.card{position:absolute;left:100px;top:90px;width:1720px;height:900px;background:var(--card);border-radius:48px;box-shadow:0 24px 60px rgba(40,70,100,.18)}
.chip{position:absolute;left:220px;top:200px;background:#e9f1f6;border-radius:999px;padding:14px 30px;font:700 22px 'Plus Jakarta Sans';letter-spacing:.06em}
h1{position:absolute;left:220px;top:290px;width:940px;font:800 92px/1.04 'Plus Jakarta Sans';letter-spacing:-.035em}
h1 em{font-style:normal;color:#7c6aad}
.terms{position:absolute;left:220px;top:620px;display:flex;gap:14px}
.terms .t{background:#a8d4c4;border-radius:999px;padding:12px 28px;font:700 26px 'Plus Jakarta Sans'}
.meta{position:absolute;left:220px;top:710px;font:500 26px 'Plus Jakarta Sans';color:#5d6b75}
.who{position:absolute;left:220px;top:800px;font:700 32px 'Plus Jakarta Sans'}
.org{position:absolute;left:220px;top:850px;font:500 24px 'Plus Jakarta Sans';color:#5d6b75}
.pills{position:absolute;right:200px;top:0;height:1080px;display:flex;align-items:center;gap:24px}
.pill{width:76px;border-radius:999px;transform:scaleY(0);transform-origin:center;transition:transform 1s cubic-bezier(.16,1,.3,1)}
.slide.visible .pill{transform:none}
.slide.visible .pill:nth-child(2){transition-delay:.08s}.slide.visible .pill:nth-child(3){transition-delay:.16s}.slide.visible .pill:nth-child(4){transition-delay:.24s}.slide.visible .pill:nth-child(5){transition-delay:.32s}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}.slide.visible .reveal{opacity:1;transform:none}.slide.visible .d2{transition-delay:.15s}.slide.visible .d3{transition-delay:.3s}.slide.visible .d4{transition-delay:.5s}
</style></head><body><div class="deck-viewport"><main class="deck-stage" id="deckStage"><section class="slide active">
<div class="card"></div>
<div class="chip reveal">Module 2 · Lecture 3</div>
<h1 class="reveal d2">Biomimicry and <em>nature-inspired</em> designs</h1>
<div class="terms reveal d3"><span class="t">Biomimicry</span><span class="t" style="background:#f0b4d4">Quiz: Biomimicry</span></div>
<div class="meta reveal d3">Reading: Baumeister et al. (2012)</div>
<div class="who reveal d4">SOS110</div><div class="org reveal d4">School of Sustainability · Arizona State University</div>
<div class="pills"><div class="pill" style="height:220px;background:#f0b4d4"></div><div class="pill" style="height:380px;background:#a8d4c4"></div><div class="pill" style="height:560px;background:#5a7c6a"></div><div class="pill" style="height:380px;background:#9b8dc4"></div><div class="pill" style="height:220px;background:#7c6aad"></div></div>
</section></main></div><script>
const st=document.getElementById('deckStage');
function sc(){const f=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
sc();addEventListener('resize',sc);
requestAnimationFrame(()=>document.querySelector('.slide').classList.add('visible'));
</script></body></html>
