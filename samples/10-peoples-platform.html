<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>M6·R Equity and community resilience · SOS110</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat+Brush&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}



:root{--stage-bg:#1b1bb0;--slide-bg:#f5f2ea;--blue:#2c2cdc;--orange:#f2a03a;--red:#e83a2a;--redd:#b7281c;--ink:#141414}
.slide{font-family:'DM Mono',monospace;color:var(--ink)}
.slide::before{content:'';position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(0,0,0,.18) 1px,transparent 1px);background-size:5px 5px;pointer-events:none}
.bar{position:absolute;left:0;right:0;top:0;height:110px;background:var(--blue);border-bottom:6px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 90px;color:#f4e9d6;font:500 24px 'DM Mono';letter-spacing:.1em;text-transform:uppercase}
h1{position:absolute;left:90px;top:190px;width:1400px;font:400 150px/.9 'Alfa Slab One';text-transform:uppercase;color:var(--blue);text-shadow:7px 7px 0 var(--red),14px 14px 0 var(--redd)}
.hand{position:absolute;left:110px;top:560px;font:400 84px 'Caveat Brush';color:var(--ink);transform:rotate(-3deg)}
.hand u{text-decoration-color:var(--orange);text-decoration-thickness:10px;text-underline-offset:10px}
.terms{position:absolute;left:90px;top:710px;display:flex;gap:16px}
.terms .t{border:5px solid var(--ink);background:#fff;padding:10px 22px;font:400 30px 'Alfa Slab One';text-transform:uppercase;box-shadow:6px 6px 0 var(--red)}
.foot{position:absolute;left:0;right:0;bottom:0;height:150px;border-top:6px solid var(--ink);background:var(--orange);display:flex;align-items:center;padding:0 90px;gap:40px;font:500 26px 'DM Mono';text-transform:uppercase;letter-spacing:.06em}
.foot b{font:400 40px 'Alfa Slab One';letter-spacing:0}
.stamp{position:absolute;right:120px;top:400px;width:260px;height:260px;border-radius:50%;border:6px solid var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font:400 40px/1.05 'Alfa Slab One';color:var(--red);transform:rotate(12deg)}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}.slide.visible .reveal{opacity:1;transform:none}.slide.visible .d2{transition-delay:.15s}.slide.visible .d3{transition-delay:.3s}.slide.visible .d4{transition-delay:.5s}
</style></head><body><div class="deck-viewport"><main class="deck-stage" id="deckStage"><section class="slide active">
<div class="bar"><span>Module 6 — Complex Socio-economic Issues and Sustainable Innovations</span><span>Review session</span></div>
<h1 class="reveal">Equity &amp; community</h1>
<div class="hand reveal d2">building <u>resilience</u> together!</div>
<div class="terms reveal d3"><span class="t">Environmental Equity</span> <span class="t">Environmental Justice</span> <span class="t">Community Resilience</span></div>
<div class="stamp reveal d3">TEST<br>2</div>
<div class="foot reveal d4"><b>SOS110</b><span>School of Sustainability · Arizona State University</span></div>
</section></main></div><script>
const st=document.getElementById('deckStage');
function sc(){const f=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
sc();addEventListener('resize',sc);
requestAnimationFrame(()=>document.querySelector('.slide').classList.add('visible'));
</script></body></html>
